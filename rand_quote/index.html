<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="index.js"></script>
    <title>random quote generator</title>
  </head>
  <body>
    <div class="wrapper">
      <h1 class="title">generate a random quote</h1>

      <div class="panel">
        <div class="quote-box">
          <blockquote class="quote" id="quote">...</blockquote>
          <span class="author" id="author">...</span>
        </div>
        <div class="btns">
          <button class="btn" id="new">new quote</button>
          <button class="btn" id="copy">
            <i data-lucide="copy" class="icon"></i>
          </button>
        </div>
      </div>
    </div>
  </body>
  <script src="https://unpkg.com/lucide@latest"></script>
</html>
